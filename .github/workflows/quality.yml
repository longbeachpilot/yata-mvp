name: Quality

on:
  push:
    branches:
      - main
      - chatgpt/**
  pull_request:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and production build
        run: npm run check
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: preview-build-placeholder
          NEXT_PUBLIC_KAKAO_JS_KEY: browser-test-placeholder

      - name: Install Chromium for browser contract checks
        run: npx playwright install --with-deps chromium

      - name: Verify mobile and desktop booking journey
        run: npm run test:browser
        env:
          YATA_TEST_SUPABASE_URL: https://example.supabase.co

      - name: Save browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: booking-journey-screenshots
          path: test-results/
          retention-days: 7
